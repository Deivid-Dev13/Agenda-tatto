}
body::after{
  content:'';
  position:fixed;
  inset:0;
  z-index:-2;
  background:rgba(var(--bg-rgb),.68);
}
h1,h2,h3,h4{
  font-family:'Oswald', 'Arial Narrow', sans-serif;
  font-weight:600;
  letter-spacing:.2px;
  margin:0;
  text-transform:none;
}
a{color:inherit;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--accent);color:var(--on-accent);}

/* ---------- layout ---------- */
#appRoot{display:flex;min-height:100vh;}

.sidebar{
  width:220px;
  flex-shrink:0;
  background:rgba(var(--bg-elevated-rgb),.8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-right:1px solid var(--border);
  padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px)) 14px;
  display:flex;
  flex-direction:column;
  gap:22px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  z-index:2;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:0 4px;
}
.brand .mark{
  font-family:'Permanent Marker', cursive;
  font-size:22px;
  color:var(--accent);
  line-height:1;
}
.brand .sub{
  font-size:10.5px;
  letter-spacing:.4px;
  color:var(--text-muted);
}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav button{
  display:flex;
  align-items:center;
  gap:10px;
  background:none;
  border:none;
  text-align:left;
  padding:9px 10px;
  border-radius:var(--radius);
  color:var(--text-muted);
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
  border-left:2px solid transparent;
}
.nav button .ic{font-size:15px;width:18px;text-align:center;}
.nav button:hover{background:var(--bg-sunken);color:var(--text);}
.nav button.active{color:var(--text);border-left:2px solid var(--accent);background:var(--bg-sunken);}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;}
.theme-toggle{
  display:flex;gap:4px;background:var(--bg-sunken);padding:3px;border-radius:var(--radius);border:1px solid var(--border);
}
.theme-toggle button{
  flex:1;background:none;border:none;padding:6px 4px;font-size:11px;border-radius:2px;cursor:pointer;color:var(--text-muted);
}
.theme-toggle button.active{background:var(--bg-elevated);color:var(--text);box-shadow:var(--shadow);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 26px;border-bottom:1px solid var(--border);
  background:rgba(var(--bg-rgb),.78);backdrop-filter: blur(6px);-webkit-backdrop-filter: blur(6px);position:sticky;top:0;z-index:20;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
.topbar h1{font-size:19px;}
.topbar .today{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;}
.content{padding:22px 26px 90px 26px;max-width:1180px;width:100%;}
.view{display:none;}
.view.active{display:block;}

/* ---------- buttons ---------- */
.btn{
  appearance:none;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);
  padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--gold);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:none;border-color:transparent;}
.btn-ghost:hover{background:var(--bg-sunken);border-color:transparent;}
.btn-danger{color:var(--money-neg);}
.btn-sm{padding:5px 9px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- cards / grid ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
.stat-card{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;position:relative;overflow:hidden;
}
.stat-card .label{font-size:11px;color:var(--text-muted);letter-spacing:.3px;margin-bottom:6px;}
.stat-card .value{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;}
.stat-card .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
.stat-card.pos .accent-bar{background:var(--money-pos);}
.stat-card.neg .accent-bar{background:var(--money-neg);}
.stat-card.gold .accent-bar{background:var(--gold);}
.stat-card .sub{font-size:11px;color:var(--text-muted);margin-top:4px;}

.panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:15px;}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;}
.chart-box{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.chart-box h4{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-bottom:10px;letter-spacing:.2px;}
.chart-svg-wrap{width:100%;}
.chart-empty{height:240px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12.5px;}
.month-picker{
  border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);
  padding:7px 10px;border-radius:3px;font-weight:600;font-size:13px;font-family:inherit;
  color-scheme: dark;
}
:root[data-theme="light"] .month-picker{ color-scheme: light; }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .month-picker{ color-scheme: light; }
}
.month-picker::-webkit-calendar-picker-indicator{ cursor:pointer; border-radius:2px; }
.section-subtitle{
  font-size:11.5px;color:var(--text-muted);margin:2px 0 10px 0;
  display:flex;align-items:center;gap:6px;
}
.section-subtitle::before{content:'●';color:var(--gold);font-size:8px;}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:12px;font-weight:600;color:var(--text-muted);}
.field input,.field select,.field textarea{
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  padding:8px 10px;border-radius:var(--radius);width:100%;
}
.field textarea{resize:vertical;min-height:56px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.hint{font-size:11px;color:var(--text-muted);margin-top:2px;}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg-sunken);}
.money{font-variant-numeric:tabular-nums;font-weight:600;}
.money.pos{color:var(--money-pos);}
.money.neg{color:var(--money-neg);}
.row-actions{display:flex;gap:4px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9;}
.badge.st-agendado{background:var(--status-agendado);}
.badge.st-confirmado{background:var(--status-confirmado);}
.badge.st-andamento{background:var(--status-andamento);}
.badge.st-concluido{background:var(--status-concluido);}
.badge.st-cancelado{background:var(--status-cancelado);}
.badge.st-nocompareceu{background:var(--status-nocompareceu);}

/* ---------- filters bar ---------- */
.filters-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filters-bar input,.filters-bar select{
  border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);
  padding:7px 10px;border-radius:var(--radius);font-size:12.5px;
}
.seg{display:flex;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.seg button{background:none;border:none;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--text-muted);border-right:1px solid var(--border);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent);color:#fff;}

/* ---------- empty state ---------- */
.empty{padding:34px 10px;text-align:center;color:var(--text-muted);}
.empty .ic{font-size:26px;margin-bottom:8px;}
.empty b{color:var(--text);display:block;margin-bottom:4px;font-size:13.5px;}

/* ---------- agenda list ---------- */
.agenda-day-group{margin-bottom:18px;}
.agenda-day-title{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:.3px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.appt-card{
  display:flex;gap:12px;padding:12px 14px;border:1px solid var(--border);border-left:3px solid var(--status-agendado);
  border-radius:var(--radius);background:var(--bg-elevated);margin-bottom:8px;cursor:pointer;align-items:flex-start;
}
.appt-card:hover{border-color:var(--gold);}
.appt-card .time{font-family:'Oswald',sans-serif;font-size:15px;min-width:46px;font-weight:600;}
.appt-card .body{flex:1;min-width:0;}
.appt-card .title{font-weight:700;font-size:13.5px;margin-bottom:2px;}
.appt-card .meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;}
.appt-card .valores{text-align:right;font-size:12px;white-space:nowrap;}

/* ---------- alerts ---------- */
.alert-item{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-sunken);margin-bottom:6px;font-size:12.5px;align-items:flex-start;}
.alert-item .ic{font-size:15px;}
.alert-item b{display:block;font-size:12.5px;}
.alert-item .d{color:var(--text-muted);font-size:11.5px;margin-top:1px;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,14,12,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:26px 14px calc(26px + env(safe-area-inset-bottom,0px)) 14px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;width:100%;max-width:560px;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35);}
.modal.modal-lg{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:16px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;line-height:1;padding:4px;}
.modal-close:hover{color:var(--text);}

/* client detail */
.client-hist-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.client-hist-item:last-child{border-bottom:none;}

/* ---------- mobile bottom nav ---------- */
.bottom-nav{display:none;}

@media (max-width:880px){
  .sidebar{display:none;}
  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(var(--bg-elevated-rgb),.85);backdrop-filter: blur(6px);-webkit-backdrop-filter: blur(6px);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;
    justify-content:space-around;
  }
  .bottom-nav button{background:none;border:none;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;padding:4px 2px;cursor:pointer;flex:1;}
  .bottom-nav button .ic{font-size:17px;}
  .bottom-nav button.active{color:var(--accent);}
  .content{padding:16px 14px 90px 14px;}
  .topbar{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  .field-row,.field-row3{grid-template-columns:1fr;}
  table{min-width:640px;}
}

/* print */
@media print{
  .sidebar,.topbar,.bottom-nav,.quick-actions,.filters-bar,.form-actions,.row-actions,.no-print{display:none !important;}
  body{background:#fff;color:#000;}
  .content{padding:0;max-width:100%;}
  .panel,.stat-card,.chart-box{border-color:#ccc;break-inside:avoid;}
}

<script>
/* ==========================================================================
   FERREIRA TATTOO — Agenda + Controle Financeiro para Tatuador
   ========================================================================== */
(function(){
"use strict";

var PREFS_KEY = 'ferreira_tattoo_prefs_v1';
var DESPESA_ALTA = 500;

var LOCAL_CORPO = ['Braço','Antebraço','Costas','Perna','Peito','Mão','Outro'];
var FORMAS_PAGAMENTO = ['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Outro'];
var STATUS_LIST = ['Agendado','Confirmado','Em andamento','Concluído','Cancelado','Não compareceu'];
var STATUS_CLASS = {
  'Agendado':'st-agendado','Confirmado':'st-confirmado','Em andamento':'st-andamento',
  'Concluído':'st-concluido','Cancelado':'st-cancelado','Não compareceu':'st-nocompareceu'
};
var DEFAULT_CATEGORIAS = ['Materiais','Tintas','Agulhas','Luvas','Papel','Higiene','Aluguel','Energia','Água','Internet','Marketing','Equipamentos','Manutenção','Transporte','Alimentação','Outros'];

var NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', ic:'◆'},
  {id:'agenda', label:'Agenda', ic:'▤'},
  {id:'clientes', label:'Clientes', ic:'◍'},
  {id:'entradas', label:'Entradas', ic:'↓'},
  {id:'saidas', label:'Saídas', ic:'↑'},
  {id:'financeiro', label:'Financeiro', ic:'≡'},
  {id:'fechamento', label:'Fechamento', ic:'▣'}
];

/* ---------------------------- utilidades --------------------------------*/
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function brl(v){ v = Number(v)||0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function dateBR(iso){ if(!iso) return '—'; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoFromDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return isoFromDate(new Date()); }
function parseISO(iso){ var p=iso.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(mk){
  var p=mk.split('-'); var names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return names[Number(p[1])-1]+' de '+p[0];
}
function monthShort(mk){
  var p=mk.split('-'); var names=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return names[Number(p[1])-1]+'/'+p[0].slice(2);
}
function addMonths(mk, n){
  var p=mk.split('-').map(Number); var d=new Date(p[0],p[1]-1+n,1); return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function daysInMonth(mk){ var p=mk.split('-').map(Number); return new Date(p[0],p[1],0).getDate(); }
function startOfWeek(d){ var day=(d.getDay()+6)%7; var r=new Date(d); r.setDate(d.getDate()-day); r.setHours(0,0,0,0); return r; }
function endOfWeek(d){ var s=startOfWeek(d); var e=new Date(s); e.setDate(s.getDate()+6); return e; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function weekOfMonthIdx(day){ return Math.min(4, Math.floor((day-1)/7)); }

/* ---------------------------- estado -------------------------------------*/
var App = {
  state: null,
  charts: {},

  defaultState: function(){
    var tISO = todayISO();
    return {
      theme: 'dark',
      currentView: 'dashboard',
      dashboardMonth: monthKey(tISO),
      agendaView: 'semana',
      agendaRefDate: tISO,
      agendaFilters: {status:'', busca:''},
      entradasFilters: {mes: monthKey(tISO), busca:'', forma:''},
      saidasFilters: {mes: monthKey(tISO), busca:'', categoria:''},
      financeiroPeriodo: 'mes',
      financeiroCustom: {de: tISO, ate: tISO},
      fechamentoMonth: monthKey(tISO),
      categorias: DEFAULT_CATEGORIAS.slice(),
      clientes: [],
      agendamentos: [],
      entradas: [],
      saidas: []
    };
  },

  PREF_KEYS: ['theme','currentView','dashboardMonth','agendaView','agendaRefDate','agendaFilters','entradasFilters','saidasFilters','financeiroPeriodo','financeiroCustom','fechamentoMonth'],
  /* Preferências de TELA (tema, filtros, aba atual) ficam no aparelho.
     Dados de negócio NUNCA passam por aqui: vivem no Supabase. */
  load: function(){
    this.state = this.defaultState();
    try{
      var prefs = JSON.parse(localStorage.getItem(PREFS_KEY)||'null');
      if(prefs){ this.PREF_KEYS.forEach(function(k){ if(prefs[k]!==undefined) App.state[k]=prefs[k]; }); }
    }catch(e){}
  },
  save: function(){
    try{
      var prefs = {}; this.PREF_KEYS.forEach(function(k){ prefs[k]=App.state[k]; });
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    }catch(e){}
  },

  /* --------------------------- consultas -------------------------------*/
  recebidoDoAgendamento: function(agId){
    return this.state.entradas.filter(function(e){return e.agendamentoId===agId;}).reduce(function(s,e){return s+Number(e.valor||0);},0);
  },
  restanteDoAgendamento: function(ag){
    var r = Number(ag.valor||0) - this.recebidoDoAgendamento(ag.id);
    return r>0 ? r : 0;
  },
  entradasNoPeriodo: function(de, ate){
    return this.state.entradas.filter(function(e){ return e.data>=de && e.data<=ate; });
  },
  saidasNoPeriodo: function(de, ate){
    return this.state.saidas.filter(function(e){ return e.data>=de && e.data<=ate; });
  },
  sum: function(list){ return list.reduce(function(s,e){return s+Number(e.valor||0);},0); },
  clienteById: function(id){ return this.state.clientes.find(function(c){return c.id===id;}); },
  agendamentoById: function(id){ return this.state.agendamentos.find(function(a){return a.id===id;}); },

  toast: function(msg){
    var el = document.getElementById('toastEl');
    if(!el){
      el = document.createElement('div'); el.id='toastEl';
      el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#14110d;color:#f1e9d8;border:1px solid #d4af37;padding:10px 18px;border-radius:6px;font-size:12.5px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:88vw;text-align:center;';
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity='1';
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(function(){ el.style.transition='opacity .4s'; el.style.opacity='0'; }, 2600);
  }
};
window.App = App;

/* ============================ CAMADA DE DADOS (SUPABASE) ====================
   Fonte única da verdade: PostgreSQL no Supabase (tabelas por registro).
   - Auth: login por e-mail/senha (Supabase Auth)
   - RLS: cada usuário só enxerga o próprio studio (ver supabase/migrations)
   - Realtime: INSERT/UPDATE/DELETE por linha chegam em todos os aparelhos
   O localStorage guarda APENAS preferências de tela (tema, filtros, aba).
   ==============================================================================*/
var CFG = window.FERREIRA_CONFIG || {};
var LEGACY_KEYS = ['ferreira_tattoo_v2','ferreira_tattoo_v1'];
var LEGACY_DONE_KEY = 'ferreira_tattoo_legacy_imported';

/* ---- mapeadores: linha do banco (snake_case) <-> objeto da tela ---- */
function clienteToDb(c, studioId){
  var r = {nome:c.nome, telefone:c.telefone||null, instagram:c.instagram||null,
    data_primeiro_atendimento:c.primeiro||null, observacoes:c.observacoes||null};
  if(studioId) r.studio_id = studioId; return r;
}
function mapClienteFromDb(r){
  return {id:r.id, nome:r.nome, telefone:r.telefone||'', instagram:r.instagram||'',
    primeiro:r.data_primeiro_atendimento||'', observacoes:r.observacoes||'', _v:r.updated_at};
}
function agendamentoToDb(a, studioId){
  var r = {cliente_id:a.clienteId||null, cliente_nome:a.clienteNome||null, telefone:a.telefone||null,
    data:a.data, hora_inicio:a.horaInicio||null, hora_fim:a.horaFim||null, tatuagem:a.tatuagem,
    local_corpo:a.localCorpo||null, valor:Number(a.valor)||0, status:a.status, observacoes:a.observacoes||null};
  if(studioId) r.studio_id = studioId; return r;
}
function mapAgendamentoFromDb(r){
  return {id:r.id, clienteId:r.cliente_id, clienteNome:r.cliente_nome||'', telefone:r.telefone||'',
    data:r.data, horaInicio:r.hora_inicio||'', horaFim:r.hora_fim||'', tatuagem:r.tatuagem,
    localCorpo:r.local_corpo||'', valor:Number(r.valor)||0, status:r.status, observacoes:r.observacoes||'',
    criadoEm:(r.created_at||'').slice(0,10), _v:r.updated_at};
}
function entradaToDb(e, studioId){
  var r = {cliente_id:e.clienteId||null, cliente_nome:e.clienteNome||null, agendamento_id:e.agendamentoId||null,
    data:e.data, descricao:e.descricao, valor:Number(e.valor), forma_pagamento:e.formaPagamento,
    parcelado:!!e.parcelado, parcelas:e.parcelado?(e.parcelas||2):null, observacao:e.observacao||null};
  if(studioId) r.studio_id = studioId; return r;
}
function mapEntradaFromDb(r){
  return {id:r.id, data:r.data, clienteId:r.cliente_id, clienteNome:r.cliente_nome||'', agendamentoId:r.agendamento_id,
    descricao:r.descricao, valor:Number(r.valor)||0, formaPagamento:r.forma_pagamento, parcelado:!!r.parcelado,
    parcelas:r.parcelas, observacao:r.observacao||'', _v:r.updated_at};
}
function saidaToDb(s, studioId){
  var r = {data:s.data, categoria:s.categoria, descricao:s.descricao, valor:Number(s.valor),
    forma_pagamento:s.formaPagamento, observacao:s.observacao||null, recorrente:!!s.recorrente,
    dia_vencimento:s.recorrente?(s.diaVencimento||1):null};
  if(studioId) r.studio_id = studioId; return r;
}
function mapSaidaFromDb(r){
  return {id:r.id, data:r.data, categoria:r.categoria, descricao:r.descricao, valor:Number(r.valor)||0,
    formaPagamento:r.forma_pagamento, observacao:r.observacao||'', recorrente:!!r.recorrente,
    diaVencimento:r.dia_vencimento, _v:r.updated_at};
}
var TABLE_MAPPERS = {clientes:mapClienteFromDb, agendamentos:mapAgendamentoFromDb, entradas:mapEntradaFromDb, saidas:mapSaidaFromDb};
var TABLE_TO_DB = {clientes:clienteToDb, agendamentos:agendamentoToDb, entradas:entradaToDb, saidas:saidaToDb};

/* ---- estado em memória (cache da nuvem; nunca gravado no localStorage) ---- */
App.upsertLocal = function(key, obj){
  var list = App.state[key];
  var i = list.findIndex(function(x){return x.id===obj.id;});
  if(i===-1) list.push(obj); else list[i] = obj;
};
App.applyInitialData = function(results){
  var failed = results.filter(function(r){return r.error;})[0];
  if(failed) throw failed.error;
  App.state.clientes = results[0].data.map(mapClienteFromDb);
  App.state.agendamentos = results[1].data.map(mapAgendamentoFromDb);
  App.state.entradas = results[2].data.map(mapEntradaFromDb);
  App.state.saidas = results[3].data.map(mapSaidaFromDb);
  App.state.categorias = results[4].data.length ? results[4].data.map(function(c){return c.nome;}) : DEFAULT_CATEGORIAS.slice();
};

App.db = {
  client:null, channels:[], studioId:null, studioNome:'', userId:null, userEmail:'', role:'',
  isConfigured: function(){ return !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY); },
  init: function(){ this.client = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); },
  loadAll: function(studioId){
    var c = this.client;
    return Promise.all([
      c.from('clientes').select('*').eq('studio_id', studioId).order('nome'),
      c.from('agendamentos').select('*').eq('studio_id', studioId).order('data'),
      c.from('entradas').select('*').eq('studio_id', studioId).order('data', {ascending:false}),
      c.from('saidas').select('*').eq('studio_id', studioId).order('data', {ascending:false}),
      c.from('categorias').select('*').eq('studio_id', studioId).order('nome')
    ]);
  },
  startRealtime: function(){
    this.stopRealtime();
    var self = this, sid = this.studioId;
    ['clientes','agendamentos','entradas','saidas'].forEach(function(table){
      var ch = self.client.channel('rt-'+table+'-'+sid)
        // sem "filter" de coluna de propósito: o Supabase não entrega DELETE em assinaturas filtradas.
        // INSERT/UPDATE já chegam restritos pela RLS; reforçamos conferindo o studio_id abaixo.
        .on('postgres_changes', {event:'*', schema:'public', table:table}, function(p){ App.handleRealtimeEvent(table, p); })
        .subscribe(function(status){
          if(status==='SUBSCRIBED') App.setSyncStatus('saved');
          if(status==='CHANNEL_ERROR' || status==='TIMED_OUT') App.setSyncStatus(navigator.onLine?'error':'offline');
        });
      self.channels.push(ch);
    });
  },
  stopRealtime: function(){
    var self = this;
    this.channels.forEach(function(ch){ try{ self.client.removeChannel(ch); }catch(e){} });
    this.channels = [];
  }
};

/* ---- Realtime: aplica SÓ a linha que mudou (não substitui o estado todo) ---- */
App.handleRealtimeEvent = function(table, payload){
  var mapper = TABLE_MAPPERS[table], type = payload.eventType;
  if(type==='INSERT' || type==='UPDATE'){
    if(payload.new && payload.new.studio_id && payload.new.studio_id!==App.db.studioId) return; // defesa em profundidade
    App.upsertLocal(table, mapper(payload.new));
  } else if(type==='DELETE'){
    var oldId = payload.old && payload.old.id;
    App.state[table] = App.state[table].filter(function(x){return x.id!==oldId;});
    if(table==='clientes') App.state.agendamentos.forEach(function(a){ if(a.clienteId===oldId) a.clienteId=null; });
    if(table==='agendamentos') App.state.entradas.forEach(function(e){ if(e.agendamentoId===oldId) e.agendamentoId=null; });
  }
  App.scheduleRender();
};
App.scheduleRender = function(){
  clearTimeout(App._renderTimer);
  App._renderTimer = setTimeout(function(){
    var ae = document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.closest && ae.closest('.view')){ App.scheduleRender(); return; } // não rouba o foco de quem está digitando
    if(App.db.studioId) App.renderView(App.state.currentView);
  }, 200);
};

/* ---- atualização de UM registro com controle de concorrência (updated_at) ---- */
App.updateRecord = async function(table, id, row){
  var cur = App.state[table].find(function(x){return x.id===id;});
  var q = App.db.client.from(table).update(row).eq('id', id);
  if(cur && cur._v) q = q.eq('updated_at', cur._v);
  var res = await q.select().maybeSingle();
  if(res.error) throw res.error;
  if(!res.data){
    var e = new Error('conflito de edição'); e.conflict = true; throw e;
  }
  var obj = TABLE_MAPPERS[table](res.data);
  App.upsertLocal(table, obj);
  return obj;
};
App.handleSaveError = function(err, what){
  console.error('Erro ao '+what+':', err);
  if(err && err.conflict){
    App.setSyncStatus('error');
    App.toast('Este registro foi alterado em outro aparelho. A tela foi atualizada — revise e salve de novo.');
    App.refreshAll();
    return;
  }
  if(!navigator.onLine){
    App.setSyncStatus('offline');
    App.toast('Sem conexão. Nada foi salvo — tente novamente quando a internet voltar.');
    return;
  }
  App.setSyncStatus('error');
  App.toast('Não foi possível '+what+'. Verifique sua conexão e tente novamente.');
};

/* ---- status de sincronização + offline ---- */
App.setSyncStatus = function(status){
  App._sync = status;
  var el = document.getElementById('syncStatus');
  if(!el) return;
  var map = {saving:['Salvando…','var(--text-muted)'], saved:['Sincronizado','var(--money-pos)'],
    error:['Erro ao salvar','var(--money-neg)'], offline:['Sem conexão','var(--money-neg)']};
  var m = map[status] || map.saved;
  el.textContent = '● '+m[0]; el.style.color = m[1];
};
App.refreshAll = async function(){
  if(!App.db.studioId) return;
  try{
    App.applyInitialData(await App.db.loadAll(App.db.studioId));
    App.renderView(App.state.currentView);
    App.setSyncStatus('saved');
  }catch(err){ console.error('Erro ao atualizar dados:', err); App.setSyncStatus(navigator.onLine?'error':'offline'); }
};
window.addEventListener('offline', function(){
  App.setSyncStatus('offline');
  App.toast('Você está sem conexão. Alterações não serão salvas até a internet voltar.');
});
window.addEventListener('online', function(){
  App.toast('Conexão restabelecida. Atualizando dados…');
  App.refreshAll();
  if(App.db.studioId) App.db.startRealtime();
});

function authMsg(t){ var el=document.getElementById('authMsg'); if(el) el.textContent=t; }
function friendlyAuthError(err){
  var m = (err && err.message || '').toLowerCase();
  if(m.indexOf('invalid login')!==-1) return 'E-mail ou senha incorretos.';
  if(m.indexOf('email not confirmed')!==-1) return 'E-mail ainda não confirmado. Verifique sua caixa de entrada.';
  if(m.indexOf('fetch')!==-1 || !navigator.onLine) return 'Sem conexão. Verifique sua internet.';
  return 'Não foi possível entrar. Tente novamente.';
}
App.doLogin = async function(){
  var email = document.getElementById('f_loginEmail').value.trim();
  var pass = document.getElementById('f_loginPass').value;
  if(!email || !pass){ authMsg('Informe e-mail e senha.'); return; }
  var btn = document.getElementById('btnLogin'); btn.disabled = true; authMsg('Entrando…');
  try{
    var res = await App.db.client.auth.signInWithPassword({email:email, password:pass});
    if(res.error) throw res.error;
    await App.bootstrapSession();
  }catch(err){
    console.error('Erro no login:', err);
    var b = document.getElementById('btnLogin'); if(b) b.disabled = false;
    authMsg(friendlyAuthError(err));
  }
};
App.forgotPassword = async function(){
  var email = document.getElementById('f_loginEmail').value.trim();
  if(!email){ authMsg('Digite seu e-mail acima e clique novamente.'); return; }
  try{
    var res = await App.db.client.auth.resetPasswordForEmail(email, {redirectTo: window.location.origin});
    if(res.error) throw res.error;
    authMsg('Enviamos um link para redefinir a senha no seu e-mail.');
  }catch(err){ console.error(err); authMsg('Não foi possível enviar o e-mail agora. Tente novamente.'); }
};
App.doNewPassword = async function(){
  var p = document.getElementById('f_newPass').value;
  if(!p || p.length<6){ authMsg('A senha precisa ter pelo menos 6 caracteres.'); return; }
  try{
    var res = await App.db.client.auth.updateUser({password:p});
    if(res.error) throw res.error;
    await App.bootstrapSession();
  }catch(err){ console.error(err); authMsg('Não foi possível salvar a nova senha. Tente novamente.'); }
};
App.doLogout = async function(){
  // zera ANTES do signOut: o evento SIGNED_OUT não pode disparar outro logout (evita laço)
  App.db.studioId = null; App.db.userId = null; App.db.role = '';
  App.state.clientes = []; App.state.agendamentos = []; App.state.entradas = []; App.state.saidas = [];
  try{ App.db.stopRealtime(); await App.db.client.auth.signOut(); }catch(e){ console.error(e); }
  closeModal(); App.renderLogin();
};
App.doOnboarding = async function(){
  var nome = document.getElementById('f_studioNome').value.trim();
  if(!nome){ authMsg('Informe o nome do estúdio.'); return; }
  var btn = document.getElementById('btnOnb'); btn.disabled = true; authMsg('Criando…');
  try{
    var c = App.db.client;
    var slug = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Math.random().toString(36).slice(2,6);
    var studioId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null;
    // id gerado no cliente: evita precisar de SELECT logo após o INSERT (a policy de leitura só libera depois do profile existir)
    var rs = await c.from('studios').insert(studioId ? {id:studioId, nome:nome, slug:slug} : {nome:nome, slug:slug});
    if(rs.error) throw rs.error;
    var rp = await c.from('profiles').insert({user_id:App.db.userId, studio_id:studioId, nome:'', email:App.db.userEmail, role:'owner'});
    if(rp.error) throw rp.error;
    await c.from('categorias').insert(DEFAULT_CATEGORIAS.map(function(n){ return {studio_id:studioId, nome:n}; }));
    await App.bootstrapSession();
  }catch(err){
    console.error('Erro no onboarding:', err);
    var b = document.getElementById('btnOnb'); if(b) b.disabled = false;
    authMsg('Não foi possível criar o estúdio. Tente novamente.');
  }
};

/* ---- sessão -> perfil -> dados -> app ---- */
App.bootstrapSession = async function(){
  if(App._booting) return; App._booting = true;
  try{
    var sres = await App.db.client.auth.getSession();
    var session = sres.data && sres.data.session;
    if(!session){ App.renderLogin(); return; }
    App.db.userId = session.user.id; App.db.userEmail = session.user.email || '';
    var pr = await App.db.client.from('profiles').select('*').eq('user_id', App.db.userId).maybeSingle();
    if(pr.error) throw pr.error;
    if(!pr.data){ App.renderOnboarding(); return; }
    App.db.studioId = pr.data.studio_id; App.db.role = pr.data.role;
    var st = await App.db.client.from('studios').select('nome').eq('id', App.db.studioId).maybeSingle();
    App.db.studioNome = (st.data && st.data.nome) || '';
    App.applyInitialData(await App.db.loadAll(App.db.studioId));
    App.renderShell();
    App.switchView(App.state.currentView || 'dashboard');
    App.setSyncStatus(navigator.onLine ? 'saved' : 'offline');
    App.db.startRealtime();
  }catch(err){
    App.renderLoadError(err);
  }finally{ App._booting = false; }
};

/* ---- conta, logout e importação de dados antigos ---- */
App.findLegacyData = function(){
  if(localStorage.getItem(LEGACY_DONE_KEY)) return null;
  for(var i=0;i<LEGACY_KEYS.length;i++){
    try{
      var raw = localStorage.getItem(LEGACY_KEYS[i]); if(!raw) continue;
      var d = JSON.parse(raw);
      var n = (d.clientes||[]).length + (d.agendamentos||[]).length + (d.entradas||[]).length + (d.saidas||[]).length;
      if(n>0) return d;
    }catch(e){}
  }
  return null;
};
App.importLegacy = function(){
  var legacy = App.findLegacyData(); if(!legacy){ App.toast('Nenhum dado antigo encontrado neste navegador.'); return; }
  var n = (legacy.clientes||[]).length+' clientes, '+(legacy.agendamentos||[]).length+' agendamentos, '+(legacy.entradas||[]).length+' entradas, '+(legacy.saidas||[]).length+' saídas';
  confirmModal('Importar para a nuvem os dados antigos deste navegador ('+n+')? Os dados antigos NÃO serão apagados deste aparelho. Faça isso apenas uma vez, para não duplicar registros.', async function(){
    App.setSyncStatus('saving');
    try{
      var r = await App.runLegacyImport(legacy);
      localStorage.setItem(LEGACY_DONE_KEY, '1');
      await App.refreshAll();
      App.toast('Importação concluída: '+r.importados+' registros'+(r.ignorados?(' ('+r.ignorados+' ignorados por dados inválidos)'):'')+'.');
    }catch(err){ App.handleSaveError(err, 'importar os dados antigos'); }
  });
};
App.runLegacyImport = async function(legacy){
  var c = App.db.client, sid = App.db.studioId, map = {}, importados = 0, ignorados = 0;
  function newId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null; }
  async function insertAll(table, rows){
    for(var i=0;i<rows.length;i+=100){
      var res = await c.from(table).insert(rows.slice(i,i+100));
      if(res.error) throw res.error;
    }
    importados += rows.length;
  }
  var cli = (legacy.clientes||[]).filter(function(x){return x.nome;}).map(function(x){
    var id = newId(); map[x.id] = id; var r = clienteToDb(x, sid); r.id = id; return r; });
  await insertAll('clientes', cli);
  var ags = [];
  (legacy.agendamentos||[]).forEach(function(a){
    if(!a.data || !a.tatuagem || STATUS_LIST.indexOf(a.status)===-1){ ignorados++; return; }
    var id = newId(); map[a.id] = id; var r = agendamentoToDb(Object.assign({}, a, {clienteId: map[a.clienteId]||null}), sid); r.id = id; ags.push(r); });
  await insertAll('agendamentos', ags);
  var ents = [];
  (legacy.entradas||[]).forEach(function(e){
    if(!e.data || !(Number(e.valor)>0) || !e.descricao){ ignorados++; return; }
    var r = entradaToDb(Object.assign({}, e, {clienteId: map[e.clienteId]||null, agendamentoId: map[e.agendamentoId]||null}), sid); r.id = newId(); ents.push(r); });
  await insertAll('entradas', ents);
  var sds = [];
  (legacy.saidas||[]).forEach(function(s){
    if(!s.data || !(Number(s.valor)>0) || !s.descricao || !s.categoria){ ignorados++; return; }
    var r = saidaToDb(s, sid); r.id = newId(); sds.push(r); });
  await insertAll('saidas', sds);
  var extras = (legacy.categorias||[]).filter(function(n){ return DEFAULT_CATEGORIAS.indexOf(n)===-1; }).map(function(n){ return {studio_id:sid, nome:n}; });
  if(extras.length){ var rc = await c.from('categorias').upsert(extras, {onConflict:'studio_id,nome', ignoreDuplicates:true}); if(rc.error) throw rc.error; }
  return {importados:importados, ignorados:ignorados};
};

App.applyTheme = function(){
  var t = App.state.theme || 'auto';
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-toggle button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-t')===t);
  });
};
App.setTheme = function(t){ App.state.theme=t; App.save(); App.applyTheme(); };

App.switchView = function(v){
  App.state.currentView = v; App.save();
  document.querySelectorAll('.nav button, .bottom-nav button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-view')===v);
  });
  document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
  var el = document.getElementById('view-'+v);
  if(el) el.classList.add('active');
  var titles = {dashboard:['Dashboard','Visão geral do estúdio'],agenda:['Agenda','Horários e agendamentos'],clientes:['Clientes','Cadastro e histórico'],entradas:['Entradas','Dinheiro que entrou no caixa'],saidas:['Saídas','Despesas do estúdio'],financeiro:['Financeiro','Entradas, saídas e saldo por período'],fechamento:['Fechamento do mês','Resumo completo do período']};
  document.getElementById('pageTitle').textContent = titles[v][0];
  document.getElementById('pageSub').textContent = titles[v][1]+' · '+dateBR(todayISO());
  App.renderView(v);
};

App.renderView = function(v){
  if(v==='dashboard') App.renderDashboard();
  else if(v==='agenda') App.renderAgenda();
  else if(v==='clientes') App.renderClientes();
  else if(v==='entradas') App.renderEntradas();
  else if(v==='saidas') App.renderSaidas();
  else if(v==='financeiro') App.renderFinanceiro();
  else if(v==='fechamento') App.renderFechamento();
};

/* ============================== ALERTAS ===================================*/
App.computeAlerts = function(){
  var alerts = [];
  var t = todayISO();
  var in2days = isoFromDate(new Date(Date.now()+2*86400000));

  App.state.agendamentos.forEach(function(ag){
    if((ag.status==='Agendado'||ag.status==='Confirmado') && ag.data>=t && ag.data<=in2days){
      alerts.push({ic:'⏰', tipo:'Agendamento próximo', txt: ag.clienteNome+' — '+dateBR(ag.data)+' às '+ag.horaInicio, sub: ag.tatuagem});
    }
    if(ag.status==='Concluído'){
      var rest = App.restanteDoAgendamento(ag);
      if(rest>0) alerts.push({ic:'⚠', tipo:'Pagamento pendente', txt: ag.clienteNome+' deve '+brl(rest), sub: ag.tatuagem+' · '+dateBR(ag.data)});
    }
    if((!ag.valor || Number(ag.valor)<=0) && ag.status!=='Cancelado'){
      alerts.push({ic:'✎', tipo:'Sem valor informado', txt: ag.clienteNome+' — '+ag.tatuagem, sub: dateBR(ag.data)});
    }
    if(ag.status==='Cancelado'){
      var diff = Math.abs((parseISO(t)-parseISO(ag.data))/86400000);
      if(diff<=7) alerts.push({ic:'✕', tipo:'Agendamento cancelado', txt: ag.clienteNome+' — '+ag.tatuagem, sub: dateBR(ag.data)});
    }
  });

  var mk = monthKey(t);
  App.state.saidas.forEach(function(s){
    if(monthKey(s.data)===mk && Number(s.valor)>=DESPESA_ALTA){
      alerts.push({ic:'✦', tipo:'Despesa elevada', txt: s.descricao+' — '+brl(s.valor), sub: s.categoria+' · '+dateBR(s.data)});
    }
  });

  var recMap = {};
  App.state.saidas.filter(function(s){return s.recorrente && s.diaVencimento;}).forEach(function(s){
    var key = s.categoria+'|'+s.descricao;
    if(!recMap[key] || recMap[key].data<s.data) recMap[key]=s;
  });
  Object.keys(recMap).forEach(function(key){
    var s = recMap[key];
    var dv = Math.min(s.diaVencimento, daysInMonth(mk));
    var dueISO = mk+'-'+pad2(dv);
    var diff = (parseISO(dueISO)-parseISO(t))/86400000;
    var jaPagoEsseMes = App.state.saidas.some(function(x){ return monthKey(x.data)===mk && x.categoria===s.categoria && x.descricao===s.descricao; });
    if(diff>=0 && diff<=5 && !jaPagoEsseMes){
      alerts.push({ic:'⏳', tipo:'Conta recorrente próxima', txt: s.descricao+' vence dia '+dv, sub: brl(s.valor)+' · '+s.categoria});
    }
  });
  return alerts;
};

App.alertsHtml = function(){
  var alerts = App.computeAlerts();
  if(!alerts.length) return '<div class="empty"><div class="ic">✓</div><b>Tudo em dia</b>Nenhum alerta no momento.</div>';
  return alerts.map(function(a){
    return '<div class="alert-item"><span class="ic">'+a.ic+'</span><div><b>'+esc(a.tipo)+'</b>'+esc(a.txt)+'<div class="d">'+esc(a.sub||'')+'</div></div></div>';
  }).join('');
};

/* ============================== DASHBOARD =================================*/
App.renderDashboard = function(){

  var entradasMes = App.entradasNoPeriodo(de,ate);
  var saidasMes = App.saidasNoPeriodo(de,ate);
  var faturamentoMes = App.sum(entradasMes);
  var despesasMes = App.sum(saidasMes);
  var saldoMes = faturamentoMes - despesasMes;
  var tatRealizadas = App.state.agendamentos.filter(function(a){return a.status==='Concluído' && monthKey(a.data)===mk;}).length;
  var tatAgendadas = App.state.agendamentos.filter(function(a){return (a.status==='Agendado'||a.status==='Confirmado') && a.data>=t;}).length;

  var faturamentoSemana = App.sum(App.entradasNoPeriodo(wStart,wEnd));
  var faturamentoDia = App.sum(App.entradasNoPeriodo(t,t));

  var html =

    '<div class="grid-cards">'+
      statCard('Faturamento do mês', brl(faturamentoMes), saldoMes>=0?'pos':'neg')+
      statCard('Despesas do mês', brl(despesasMes), 'neg')+
      statCard('Saldo do mês', brl(saldoMes), saldoMes>=0?'pos':'neg')+
      statCard('Tatuagens realizadas', tatRealizadas, 'gold')+
      statCard('Tatuagens agendadas', tatAgendadas, '')+
    '</div>'+
    '<div class="section-subtitle">Agora — sempre o período atual, não muda com o mês selecionado acima</div>'+
    '<div class="grid-cards">'+
      statCard('Faturamento da semana', brl(faturamentoSemana), 'pos')+
      statCard('Faturamento de hoje', brl(faturamentoDia), 'pos')+
      statCard('Despesas da semana', brl(despesasSemana), 'neg')+
      statCard('Saldo atual (total geral)', brl(saldoAtual), saldoAtual>=0?'pos':'neg')+
    '</div>'+
    '<div class="charts-grid">'+
      '<div class="chart-box"><h4>Faturamento por semana — '+monthLabel(mk)+'</h4><div class="chart-svg-wrap" id="chartSemana"></div></div>'+
      '<div class="chart-box"><h4>Faturamento por mês (últimos 6 meses)</h4><div class="chart-svg-wrap" id="chartMensal"></div></div>'+
      '<div class="chart-box"><h4>Despesas por categoria — '+monthLabel(mk)+'</h4><div class="chart-svg-wrap" id="chartCategorias"></div></div>'+
      '<div class="chart-box"><h4>Entradas x Saídas (últimos 6 meses)</h4><div class="chart-svg-wrap" id="chartEntradasSaidas"></div></div>'+
    '</div>'+
    '<div class="panel"><div class="panel-head"><h3>Alertas</h3></div>'+App.alertsHtml()+'</div>';

  document.getElementById('view-dashboard').innerHTML = html;
  App.renderDashboardCharts(mk);

function statCard(label, value, cls){
  return '<div class="stat-card '+(cls||'')+'"><div class="accent-bar"></div><div class="label">'+esc(label)+'</div><div class="value">'+value+'</div></div>';
}

/* ---------- Gráficos nativos em SVG (sem nenhuma dependência externa) ---------- */
function brlShort(v){
  v = Number(v)||0;
  var sign = v<0?'-':'';
  var a = Math.abs(v);
  if(a>=1000) return sign+'R$'+(a/1000).toFixed(a>=10000?0:1).replace('.',',')+'k';
  return sign+'R$'+a.toFixed(0);
}
function svgEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function chartEmptyHtml(){ return '<div class="chart-empty">Sem dados neste período</div>'; }
function niceCeil(value){
  if(value<=0) return 1;
  var exp = Math.floor(Math.log10(value));
  var base = Math.pow(10, exp);
  var frac = value/base;
  var niceFrac = frac<=1?1:(frac<=2?2:(frac<=5?5:10));
  return niceFrac*base;
}
function yAxisGrid(niceMax, padL, padT, innerW, innerH, W){
  var steps=4, grid='';
  for(var g=0; g<=steps; g++){
    var gv = niceMax*g/steps;
    var gy = padT + innerH - (gv/niceMax)*innerH;
    grid += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(padL+innerW)+'" y2="'+gy.toFixed(1)+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="'+(g===0?'0':'3,4')+'"></line>';
    grid += '<text x="'+(padL-9)+'" y="'+(gy+3.8).toFixed(1)+'" font-size="11" text-anchor="end" fill="var(--text-muted)">'+brlShort(gv)+'</text>';
  }
  return grid;
}

function buildBarChartSVG(labels, values, colorVar){
  var W=560, H=300, padL=50, padR=14, padT=24, padB=34;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  var niceMax = niceCeil(Math.max.apply(null, values.concat([0]))||1);
  var n = values.length;
  var gap = innerW*0.26/(n+1);
  var barW = (innerW-gap*(n+1))/n;
  var bars='', labelsSvg='', valLabels='';
  for(var i=0;i<n;i++){
    var v = values[i];
    var h = (v/niceMax)*innerH;
    var x = padL+gap+i*(barW+gap);
    var y = padT+(innerH-h);
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(h,v>0?2:0).toFixed(1)+'" rx="4" fill="var('+colorVar+')"></rect>';
    var cx = x+barW/2;
    labelsSvg += '<text x="'+cx.toFixed(1)+'" y="'+(H-12)+'" font-size="12" text-anchor="middle" fill="var(--text-muted)">'+svgEsc(labels[i])+'</text>';
    if(v>0) valLabels += '<text x="'+cx.toFixed(1)+'" y="'+Math.max(y-8,padT+12).toFixed(1)+'" font-size="12.5" text-anchor="middle" fill="var(--text)" font-weight="700">'+brlShort(v)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    yAxisGrid(niceMax,padL,padT,innerW,innerH,W)+bars+labelsSvg+valLabels+'</svg>';
}

function buildLineChartSVG(labels, values, colorVar){
  var W=560, H=300, padL=50, padR=16, padT=24, padB=34;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  var niceMax = niceCeil(Math.max.apply(null, values.concat([0]))||1);
  var n = values.length;
  var stepX = n>1 ? innerW/(n-1) : 0;
  var pts = values.map(function(v,i){
    var x = padL + i*stepX;
    var y = padT + (innerH - (v/niceMax)*innerH);
    return [x,y];
  });
  var pathD = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  var areaD = pathD+' L'+pts[pts.length-1][0].toFixed(1)+','+(padT+innerH)+' L'+pts[0][0].toFixed(1)+','+(padT+innerH)+' Z';
  var dots='', labelsSvg='', valLabels='';
  pts.forEach(function(p,i){
    dots += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="var('+colorVar+')" stroke="var(--bg-elevated)" stroke-width="1.5"></circle>';
    labelsSvg += '<text x="'+p[0].toFixed(1)+'" y="'+(H-12)+'" font-size="12" text-anchor="middle" fill="var(--text-muted)">'+svgEsc(labels[i])+'</text>';
    if(values[i]>0) valLabels += '<text x="'+p[0].toFixed(1)+'" y="'+Math.max(p[1]-10,padT+12).toFixed(1)+'" font-size="12.5" text-anchor="middle" fill="var(--text)" font-weight="700">'+brlShort(values[i])+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    yAxisGrid(niceMax,padL,padT,innerW,innerH,W)+
    '<path d="'+areaD+'" fill="var('+colorVar+')" fill-opacity="0.16" stroke="none"></path>'+
    '<path d="'+pathD+'" fill="none" stroke="var('+colorVar+')" stroke-width="2.5"></path>'+
    dots+labelsSvg+valLabels+'</svg>';
}

function buildHBarChartSVG(labels, values, colorVar){
  var n = values.length;
  var rowH = 34, gap=14, padL=6, padR=86, padT=8, padB=8;
  var W=560, H = padT+padB+n*rowH+(n-1)*gap;
  var innerW = W-padL-padR;
  var niceMax = niceCeil(Math.max.apply(null, values.concat([0]))||1);
  var bars='', labelsSvg='', valLabels='', grid='';
  var steps=4;
  for(var g=1; g<=steps; g++){
    var gx = padL + innerW*g/steps;
    grid += '<line x1="'+gx.toFixed(1)+'" y1="0" x2="'+gx.toFixed(1)+'" y2="'+H+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"></line>';
  }
  for(var i=0;i<n;i++){
    var v = values[i];
    var w = (v/niceMax)*innerW;
    var y = padT + i*(rowH+gap);
    bars += '<rect x="'+padL+'" y="'+y.toFixed(1)+'" width="'+Math.max(w,v>0?3:0).toFixed(1)+'" height="'+rowH+'" rx="4" fill="var('+colorVar+')"></rect>';
    labelsSvg += '<text x="'+padL+'" y="'+(y-6).toFixed(1)+'" font-size="12" fill="var(--text-muted)">'+svgEsc(labels[i])+'</text>';
    valLabels += '<text x="'+(padL+w+8).toFixed(1)+'" y="'+(y+rowH/2+4.5).toFixed(1)+'" font-size="12.5" fill="var(--text)" font-weight="700">'+brlShort(v)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    grid+bars+labelsSvg+valLabels+'</svg>';
}

function buildGroupedBarChartSVG(labels, seriesA, seriesB, colorVarA, colorVarB, nameA, nameB){
  var W=560, H=320, padL=50, padR=14, padT=24, padB=56;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  var niceMax = niceCeil(Math.max.apply(null, seriesA.concat(seriesB).concat([0]))||1);
  var n = labels.length;
  var groupGap = innerW*0.2/(n+1);
  var groupW = (innerW-groupGap*(n+1))/n;
  var barW = groupW*0.42;
  var bars='', labelsSvg='';
  for(var i=0;i<n;i++){
    var gx = padL+groupGap+i*(groupW+groupGap);
    var va = seriesA[i], vb = seriesB[i];
    var ha = (va/niceMax)*innerH, hb=(vb/niceMax)*innerH;
    var ya = padT+(innerH-ha), yb=padT+(innerH-hb);
    bars += '<rect x="'+gx.toFixed(1)+'" y="'+ya.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(ha,va>0?2:0).toFixed(1)+'" rx="3" fill="var('+colorVarA+')"></rect>';
    bars += '<rect x="'+(gx+barW+3).toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(hb,vb>0?2:0).toFixed(1)+'" rx="3" fill="var('+colorVarB+')"></rect>';
    labelsSvg += '<text x="'+(gx+barW).toFixed(1)+'" y="'+(H-38)+'" font-size="12" text-anchor="middle" fill="var(--text-muted)">'+svgEsc(labels[i])+'</text>';
  }
  var legend = '<g>'+
    '<rect x="'+padL+'" y="'+(H-22)+'" width="11" height="11" rx="2" fill="var('+colorVarA+')"></rect>'+
    '<text x="'+(padL+16)+'" y="'+(H-12)+'" font-size="12" fill="var(--text-muted)">'+nameA+'</text>'+
    '<rect x="'+(padL+90)+'" y="'+(H-22)+'" width="11" height="11" rx="2" fill="var('+colorVarB+')"></rect>'+
    '<text x="'+(padL+106)+'" y="'+(H-12)+'" font-size="12" fill="var(--text-muted)">'+nameB+'</text>'+
  '</g>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    yAxisGrid(niceMax,padL,padT,innerW,innerH,W)+bars+labelsSvg+legend+'</svg>';
}

App.renderDashboardCharts = function(mk){
  /* Faturamento por semana */
  var weeks=[0,0,0,0,0];
  App.entradasNoPeriodo(mk+'-01', mk+'-'+pad2(daysInMonth(mk))).forEach(function(e){
    var d = Number(e.data.split('-')[2]); weeks[weekOfMonthIdx(d)] += Number(e.valor||0);
  });
  var elSemana = document.getElementById('chartSemana');
  elSemana.innerHTML = weeks.some(function(v){return v>0;}) ? buildBarChartSVG(['Sem 1','Sem 2','Sem 3','Sem 4','Sem 5'], weeks, '--accent') : chartEmptyHtml();

  /* Faturamento mensal (6 meses) */
  var mLabels=[], mData=[];
  for(var i=-5;i<=0;i++){ var m=addMonths(mk,i); mLabels.push(monthShort(m)); mData.push(App.sum(App.entradasNoPeriodo(m+'-01', m+'-'+pad2(daysInMonth(m))))); }
  var elMensal = document.getElementById('chartMensal');
  elMensal.innerHTML = mData.some(function(v){return v>0;}) ? buildLineChartSVG(mLabels, mData, '--gold') : chartEmptyHtml();

  /* Despesas por categoria */
  var catMap = {};
  App.saidasNoPeriodo(mk+'-01', mk+'-'+pad2(daysInMonth(mk))).forEach(function(s){ catMap[s.categoria]=(catMap[s.categoria]||0)+Number(s.valor||0); });
  var catLabels = Object.keys(catMap).sort(function(a,b){return catMap[b]-catMap[a];}).slice(0,6);
  var elCat = document.getElementById('chartCategorias');
  elCat.innerHTML = catLabels.length ? buildHBarChartSVG(catLabels, catLabels.map(function(k){return catMap[k];}), '--money-neg') : chartEmptyHtml();

  /* Entradas x saídas 6 meses */
  var elabels=[], edata=[], sdata=[];
  for(var j=-5;j<=0;j++){ var mm=addMonths(mk,j); elabels.push(monthShort(mm));
    edata.push(App.sum(App.entradasNoPeriodo(mm+'-01', mm+'-'+pad2(daysInMonth(mm)))));
    sdata.push(App.sum(App.saidasNoPeriodo(mm+'-01', mm+'-'+pad2(daysInMonth(mm)))));
  }
  var elES = document.getElementById('chartEntradasSaidas');
  elES.innerHTML = (edata.concat(sdata).some(function(v){return v>0;})) ? buildGroupedBarChartSVG(elabels, edata, sdata, '--money-pos', '--money-neg', 'Entradas', 'Saídas') : chartEmptyHtml();
};

/* ================================ AGENDA ==================================*/
App.agendaRange = function(){
  var ref = parseISO(App.state.agendaRefDate);
  var view = App.state.agendaView;
  if(view==='dia') return [App.state.agendaRefDate, App.state.agendaRefDate];
  if(view==='semana') return [isoFromDate(startOfWeek(ref)), isoFromDate(endOfWeek(ref))];
  var mk = monthKey(App.state.agendaRefDate);
  return [mk+'-01', mk+'-'+pad2(daysInMonth(mk))];
};
App.agendaShift = function(dir){
  var ref = parseISO(App.state.agendaRefDate);
  var view = App.state.agendaView;
  if(view==='dia') ref.setDate(ref.getDate()+dir);
  else if(view==='semana') ref.setDate(ref.getDate()+7*dir);
  else ref.setMonth(ref.getMonth()+dir);
  App.state.agendaRefDate = isoFromDate(ref); App.save(); App.renderAgenda();
};

App.renderAgenda = function(){
  var range = App.agendaRange();
  var f = App.state.agendaFilters;
  var list = App.state.agendamentos.filter(function(a){
    if(a.data<range[0] || a.data>range[1]) return false;
    if(f.status && a.status!==f.status) return false;
    if(f.busca){
      var q=f.busca.toLowerCase();
      if((a.clienteNome+' '+a.tatuagem).toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  }).sort(function(a,b){ return (a.data+a.horaInicio) < (b.data+b.horaInicio) ? -1 : 1; });

  var rangeLabel = App.state.agendaView==='dia' ? dateBR(range[0]) :
    App.state.agendaView==='semana' ? dateBR(range[0])+' – '+dateBR(range[1]) : monthLabel(monthKey(range[0]));

  var byDay = {};
  list.forEach(function(a){ (byDay[a.data]=byDay[a.data]||[]).push(a); });
  var days = Object.keys(byDay).sort();

  var bodyHtml = '';
  if(!days.length){
    bodyHtml = '<div class="empty"><div class="ic">▤</div><b>Nada por aqui</b>Nenhum agendamento neste período.</div>';
  } else {

function cssStatusVar(status){

}

App.clienteStats = function(cid){
  var ags = App.state.agendamentos.filter(function(a){return a.clienteId===cid;});
  var concl = ags.filter(function(a){return a.status==='Concluído';});
  var ultima = concl.map(function(a){return a.data;}).sort().pop();
  var totalGasto = App.sum(App.state.entradas.filter(function(e){return e.clienteId===cid;}));
  return {qtd: concl.length, ultima: ultima, totalGasto: totalGasto, agendamentos: ags.sort(function(a,b){return a.data<b.data?1:-1;})};
};

App.saveCliente = async function(id){
  var nome = document.getElementById('f_nome').value.trim();
  if(!nome){ App.toast('Informe o nome do cliente.'); return; }
  var data = {
    nome: nome, telefone: document.getElementById('f_tel').value.trim(),
    instagram: document.getElementById('f_insta').value.trim(),
    primeiro: document.getElementById('f_primeiro').value || todayISO(),
    observacoes: document.getElementById('f_obs').value.trim()
  };
  App.setSyncStatus('saving');
  try{
    if(id){
      await App.updateRecord('clientes', id, clienteToDb(data));
      // mantém o nome/telefone já copiados em agendamentos/entradas consistentes
      await App.db.client.from('agendamentos').update({cliente_nome:nome, telefone:data.telefone}).eq('cliente_id', id);
      await App.db.client.from('entradas').update({cliente_nome:nome}).eq('cliente_id', id);
      App.state.agendamentos.forEach(function(a){ if(a.clienteId===id){ a.clienteNome=nome; a.telefone=data.telefone; } });
      App.state.entradas.forEach(function(e){ if(e.clienteId===id){ e.clienteNome=nome; } });
    } else {
      var rowNew = clienteToDb(data, App.db.studioId);
      var res2 = await App.db.client.from('clientes').insert(rowNew).select().single();
      if(res2.error) throw res2.error;
      App.state.clientes.push(mapClienteFromDb(res2.data));
    }
    App.setSyncStatus('saved');
    closeModal(); App.renderView(App.state.currentView);
    App.toast('Cliente salvo.');
  }catch(err){
    App.handleSaveError(err, 'salvar o cliente');
  }
};
App.deleteCliente = function(id){
  var temAg = App.state.agendamentos.some(function(a){return a.clienteId===id;});
  var msg = temAg ? 'Este cliente possui agendamentos vinculados. Excluir mesmo assim? (os agendamentos permanecerão, sem vínculo)' : 'Excluir este cliente?';
  confirmModal(msg, async function(){
    App.setSyncStatus('saving');
    try{
      var res = await App.db.client.from('clientes').delete().eq('id', id);
      if(res.error) throw res.error;
      App.state.clientes = App.state.clientes.filter(function(c){return c.id!==id;});
      App.state.agendamentos.forEach(function(a){ if(a.clienteId===id) a.clienteId=null; });
      App.state.entradas.forEach(function(e){ if(e.clienteId===id) e.clienteId=null; });
      App.setSyncStatus('saved');
      App.renderView(App.state.currentView); App.toast('Cliente excluído.');
    }catch(err){
      App.handleSaveError(err, 'excluir o cliente');
    }
  });
};

App.fillAgendamentosDoCliente = function(selectAgId){

App.saveEntrada = async function(id){
  var valor = Number(document.getElementById('f_valor').value);
  var descricao = document.getElementById('f_descricao').value.trim();
  if(!valor || valor<=0){ App.toast('Informe um valor válido.'); return; }
  if(!descricao){ App.toast('Informe uma descrição.'); return; }
  var cid = document.getElementById('f_cliente').value || null;
  var cliente = cid ? App.clienteById(cid) : null;
  var formaPagamento = document.getElementById('f_forma').value;
  var parcelado = false, parcelas = null;
  if(formaPagamento==='Cartão de crédito'){
    parcelado = document.getElementById('f_parcelado').checked;
    if(parcelado){
      parcelas = Number(document.getElementById('f_parcelas').value)||2;
      if(parcelas<2) parcelas = 2;
    }
  }
  var data = {
    data: document.getElementById('f_data').value || todayISO(),
    clienteId: cid, clienteNome: cliente?cliente.nome:'',
    agendamentoId: document.getElementById('f_agendamento').value || null,
    descricao: descricao, valor: valor,
    formaPagamento: formaPagamento,
    parcelado: parcelado, parcelas: parcelas,
    observacao: document.getElementById('f_obsE').value.trim()
  };
  App.setSyncStatus('saving');
  try{
    if(id){
      await App.updateRecord('entradas', id, entradaToDb(data));
    } else {
      var res2 = await App.db.client.from('entradas').insert(entradaToDb(data, App.db.studioId)).select().single();
      if(res2.error) throw res2.error;
      App.state.entradas.push(mapEntradaFromDb(res2.data));
    }
    App.setSyncStatus('saved');
    closeModal(); App.renderView(App.state.currentView); App.toast('Entrada registrada.');
  }catch(err){
    App.handleSaveError(err, 'salvar a entrada');
  }
};
App.deleteEntrada = function(id){
  confirmModal('Excluir esta entrada? Essa ação não pode ser desfeita.', async function(){
    App.setSyncStatus('saving');
    try{
      var res = await App.db.client.from('entradas').delete().eq('id', id);
      if(res.error) throw res.error;
      App.state.entradas = App.state.entradas.filter(function(e){return e.id!==id;});
      App.setSyncStatus('saved');
      App.renderView(App.state.currentView); App.toast('Entrada excluída.');
    }catch(err){
      App.handleSaveError(err, 'excluir a entrada');
    }
  });
};

App.saveSaida = async function(id){
  var valor = Number(document.getElementById('f_valor').value);
  var descricao = document.getElementById('f_descricao').value.trim();
  if(!valor || valor<=0){ App.toast('Informe um valor válido.'); return; }
  if(!descricao){ App.toast('Informe uma descrição.'); return; }
  var catSel = document.getElementById('f_categoria').value;
  var categoria = catSel;
  App.setSyncStatus('saving');
  try{
    if(catSel==='__nova__'){
      categoria = document.getElementById('f_categoriaNova').value.trim();
      if(!categoria){ App.setSyncStatus('saved'); App.toast('Informe o nome da nova categoria.'); return; }
      if(App.state.categorias.indexOf(categoria)===-1){
        App.state.categorias.push(categoria);
        var resCat = await App.db.client.from('categorias').insert({studio_id:App.db.studioId, nome:categoria});
        if(resCat.error && resCat.error.code!=='23505') throw resCat.error; // 23505 = já existe (corrida entre abas), tudo bem
      }
    }
    var recorrente = document.getElementById('f_recorrente').checked;
    var data = {
      data: document.getElementById('f_data').value || todayISO(),
      categoria: categoria, descricao: descricao, valor: valor,
      formaPagamento: document.getElementById('f_forma').value,
      observacao: document.getElementById('f_obsS').value.trim(),
      recorrente: recorrente,
      diaVencimento: recorrente ? Number(document.getElementById('f_diaVenc').value)||1 : null
    };
    if(id){
      await App.updateRecord('saidas', id, saidaToDb(data));
    } else {
      var res2 = await App.db.client.from('saidas').insert(saidaToDb(data, App.db.studioId)).select().single();
      if(res2.error) throw res2.error;
      App.state.saidas.push(mapSaidaFromDb(res2.data));
    }
    App.setSyncStatus('saved');
    closeModal(); App.renderView(App.state.currentView); App.toast('Saída registrada.');
  }catch(err){
    App.handleSaveError(err, 'salvar a saída');
  }
};
App.deleteSaida = function(id){
  confirmModal('Excluir esta saída? Essa ação não pode ser desfeita.', async function(){
    App.setSyncStatus('saving');
    try{
      var res = await App.db.client.from('saidas').delete().eq('id', id);
      if(res.error) throw res.error;
      App.state.saidas = App.state.saidas.filter(function(s){return s.id!==id;});
      App.setSyncStatus('saved');
      App.renderView(App.state.currentView); App.toast('Saída excluída.');
    }catch(err){
      App.handleSaveError(err, 'excluir a saída');
    }
  });
};

function monthSelectOptions(selected, includeAll){
  var opts = includeAll ? '' : '';
  var t = todayISO();
  var out = '';
  for(var i=-11;i<=1;i++){ var m=addMonths(monthKey(t), i); out += '<option value="'+m+'" '+(m===selected?'selected':'')+'>'+monthLabel(m)+'</option>'; }

}

/* =============================== FINANCEIRO ================================*/
App.financeiroRange = function(){
  var p = App.state.financeiroPeriodo, t = todayISO();
  if(p==='hoje') return [t,t];
  if(p==='semana'){ var n=new Date(); return [isoFromDate(startOfWeek(n)), isoFromDate(endOfWeek(n))]; }
  if(p==='mes'){ var mk=monthKey(t); return [mk+'-01', mk+'-'+pad2(daysInMonth(mk))]; }
  if(p==='mesAnterior'){ var mk2=addMonths(monthKey(t),-1); return [mk2+'-01', mk2+'-'+pad2(daysInMonth(mk2))]; }
  return [App.state.financeiroCustom.de||t, App.state.financeiroCustom.ate||t];
};

App.renderFinanceiro = function(){
  var range = App.financeiroRange();
  var entradas = App.entradasNoPeriodo(range[0],range[1]);
  var saidas = App.saidasNoPeriodo(range[0],range[1]);
  var totalE = App.sum(entradas), totalS = App.sum(saidas), saldo = totalE-totalS;

  var porForma = {};
  FORMAS_PAGAMENTO.forEach(function(f){porForma[f]=0;});
  entradas.forEach(function(e){ porForma[e.formaPagamento]=(porForma[e.formaPagamento]||0)+Number(e.valor||0); });

  var periodos = [['hoje','Hoje'],['semana','Esta semana'],['mes','Este mês'],['mesAnterior','Mês anterior'],['custom','Personalizado']];
  var segHtml = periodos.map(function(p){
    return '<button class="'+(App.state.financeiroPeriodo===p[0]?'active':'')+'" onclick="App.state.financeiroPeriodo=\''+p[0]+'\';App.save();App.renderFinanceiro();">'+p[1]+'</button>';
  }).join('');

  var customHtml = App.state.financeiroPeriodo==='custom' ?
    '<div class="filters-bar" style="margin-top:10px"><label style="font-size:12px">De <input type="date" value="'+App.state.financeiroCustom.de+'" onchange="App.state.financeiroCustom.de=this.value;App.save();App.renderFinanceiro();"></label>'+
    '<label style="font-size:12px">Até <input type="date" value="'+App.state.financeiroCustom.ate+'" onchange="App.state.financeiroCustom.ate=this.value;App.save();App.renderFinanceiro();"></label></div>' : '';

  var movimentos = entradas.map(function(e){ return {data:e.data, desc:e.descricao+(e.clienteNome?' — '+e.clienteNome:''), entrada:Number(e.valor), saida:0}; })
    .concat(saidas.map(function(s){ return {data:s.data, desc:s.descricao+' ('+s.categoria+')', entrada:0, saida:Number(s.valor)}; }))
    .sort(function(a,b){ return a.data<b.data?-1:(a.data>b.data?1:0); });
  var run=0;
  var fluxoRows = movimentos.map(function(m){
    run += m.entrada - m.saida;
    return '<tr><td>'+dateBR(m.data)+'</td><td>'+esc(m.desc)+'</td>'+
      '<td class="money pos">'+(m.entrada?brl(m.entrada):'—')+'</td>'+
      '<td class="money neg">'+(m.saida?brl(m.saida):'—')+'</td>'+
      '<td class="money '+(run>=0?'pos':'neg')+'">'+brl(run)+'</td></tr>';
  }).join('');

  document.getElementById('view-financeiro').innerHTML =
    '<div class="panel-head"><div class="seg">'+segHtml+'</div>'+
    '<button class="btn btn-sm no-print" onclick="App.exportCSV(\'fluxo\')">⬇ Exportar CSV</button></div>'+
    customHtml+
    '<div class="grid-cards" style="margin-top:14px">'+
      statCard('Entradas — '+periodoNome(App.state.financeiroPeriodo), brl(totalE), 'pos')+
      statCard('Saídas — '+periodoNome(App.state.financeiroPeriodo), brl(totalS), 'neg')+
      statCard('Saldo do período', brl(saldo), saldo>=0?'pos':'neg')+
    '</div>'+
    '<div class="panel"><div class="panel-head"><h3>Recebido por forma de pagamento</h3></div>'+
    '<div class="grid-cards">'+FORMAS_PAGAMENTO.map(function(f){return statCard(f, brl(porForma[f]||0), '');}).join('')+'</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>Fluxo de caixa</h3></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Entrada</th><th>Saída</th><th>Saldo</th></tr></thead>'+
    '<tbody>'+(fluxoRows||'<tr><td colspan="5"><div class="empty"><div class="ic">≡</div><b>Sem movimentações</b>Nenhum lançamento neste período.</div></td></tr>')+'</tbody></table></div></div>';
};

App.renderFechamento = function(){
  var mk = App.state.fechamentoMonth;
  var de=mk+'-01', ate=mk+'-'+pad2(daysInMonth(mk));
  var entradas = App.entradasNoPeriodo(de,ate);
  var saidas = App.saidasNoPeriodo(de,ate);
  var totalRecebido = App.sum(entradas), totalGasto = App.sum(saidas), saldo = totalRecebido-totalGasto;
  var agsMes = App.state.agendamentos.filter(function(a){return monthKey(a.data)===mk;});
  var concluidas = agsMes.filter(function(a){return a.status==='Concluído';});
  var canceladas = agsMes.filter(function(a){return a.status==='Cancelado';});
  var ticketMedio = concluidas.length ? totalRecebido/concluidas.length : 0;

  var weeks=[0,0,0,0,0];
  entradas.forEach(function(e){ weeks[weekOfMonthIdx(Number(e.data.split('-')[2]))]+=Number(e.valor); });
  var maxW=0; weeks.forEach(function(v,i){ if(v>weeks[maxW]) maxW=i; });
  var mediaSemanal = weeks.reduce(function(a,b){return a+b;},0) / weeks.filter(function(w,i){ return i<=weekOfMonthIdx(daysInMonth(mk)-1); }).length;

  var catMap={}; saidas.forEach(function(s){ catMap[s.categoria]=(catMap[s.categoria]||0)+Number(s.valor); });
  var topCat = Object.keys(catMap).sort(function(a,b){return catMap[b]-catMap[a];})[0];

  var porForma={}; FORMAS_PAGAMENTO.forEach(function(f){porForma[f]=0;});
  entradas.forEach(function(e){ porForma[e.formaPagamento]=(porForma[e.formaPagamento]||0)+Number(e.valor); });

  document.getElementById('view-fechamento').innerHTML =
    '<div class="panel-head"><h3>Fechamento — '+monthLabel(mk)+'</h3>'+
    '<div style="display:flex;gap:8px" class="no-print"><select onchange="App.state.fechamentoMonth=this.value;App.save();App.renderFechamento();">'+monthSelectOptions(mk)+'</select>'+
    '<button class="btn btn-sm" onclick="App.exportCSV(\'fechamento\')">⬇ CSV</button>'+
    '<button class="btn btn-sm" onclick="window.print()">🖶 Imprimir / PDF</button></div></div>'+
    '<div class="panel"><h4 style="font-size:12px;color:var(--text-muted);margin-bottom:10px">FATURAMENTO</h4>'+
    '<div class="grid-cards">'+statCard('Total de tatuagens concluídas', concluidas.length,'gold')+statCard('Total recebido', brl(totalRecebido),'pos')+'</div></div>'+
    '<div class="panel"><h4 style="font-size:12px;color:var(--text-muted);margin-bottom:10px">DESPESAS</h4>'+
    '<div class="grid-cards">'+statCard('Total gasto', brl(totalGasto),'neg')+'</div></div>'+
    '<div class="panel"><h4 style="font-size:12px;color:var(--text-muted);margin-bottom:10px">RESULTADO</h4>'+
    '<div class="grid-cards">'+statCard('Saldo do mês', brl(saldo), saldo>=0?'pos':'neg')+'</div></div>'+
    '<div class="panel"><h4 style="font-size:12px;color:var(--text-muted);margin-bottom:10px">MÉDIAS</h4>'+
    '<div class="grid-cards">'+statCard('Ticket médio', brl(ticketMedio),'')+statCard('Média semanal de faturamento', brl(mediaSemanal||0),'')+'</div></div>'+
    '<div class="panel"><div class="grid-cards">'+
      statCard('Semana que mais faturou', 'Semana '+(maxW+1)+' ('+brl(weeks[maxW])+')','gold')+
      statCard('Categoria que mais gastou', topCat?topCat+' ('+brl(catMap[topCat])+')':'—','neg')+
      statCard('Tatuagens concluídas', concluidas.length,'pos')+
      statCard('Cancelamentos', canceladas.length,'neg')+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>Total recebido por forma de pagamento</h3></div>'+
    '<div class="grid-cards">'+FORMAS_PAGAMENTO.map(function(f){return statCard(f, brl(porForma[f]||0),'');}).join('')+'</div></div>';
};
