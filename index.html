    data: data, horaInicio: document.getElementById('f_hIni').value,
    horaFim: document.getElementById('f_hFim').value,
    tatuagem: tatuagem, localCorpo: document.getElementById('f_local').value,
    valor: valor, status: document.getElementById('f_status').value,
    observacoes: document.getElementById('f_obsA').value.trim()
  };

  App.setSyncStatus('saving');
  try{
    var db = App.db.client, studioId = App.db.studioId;

    // 1) cliente novo (se for o caso) — registro individual
    if(novoClienteData){
      var rc = await db.from('clientes').insert(clienteToDb(novoClienteData, studioId)).select().single();
      if(rc.error) throw rc.error;
      App.upsertLocal('clientes', mapClienteFromDb(rc.data));
      clienteId = rc.data.id;
    }
    payload.clienteId = clienteId;

    var agId;
    if(id){
      // 2a) edição: atualiza SOMENTE esta linha de agendamento
      await App.updateRecord('agendamentos', id, agendamentoToDb(payload));
      agId = id;

      // pagamento registrado ao concluir
      var payBox = document.getElementById('pagamentoConclusaoBox');
      if(payload.status==='Concluído' && payBox && payBox.style.display!=='none'){
        var valorPag = Number(document.getElementById('f_pagamentoValor').value)||0;
        if(valorPag>0){
          var parceladoC = false, parcelasC = null;
          var formaC = document.getElementById('f_pagamentoForma').value;
          if(formaC==='Cartão de crédito'){
            parceladoC = document.getElementById('f_parceladoConclusao').checked;
            if(parceladoC){
              parcelasC = Number(document.getElementById('f_parcelasConclusao').value)||2;
              if(parcelasC<2) parcelasC = 2;
            }
          }
          var rp = await db.from('entradas').insert(entradaToDb({
            data: document.getElementById('f_pagamentoData').value||todayISO(),
            clienteId: clienteId, clienteNome: clienteNome, agendamentoId: agId,
            descricao: 'Pagamento — '+tatuagem, valor: valorPag,
            formaPagamento: formaC, parcelado: parceladoC, parcelas: parcelasC, observacao: ''
          }, studioId)).select().single();
          if(rp.error) throw rp.error;
          App.upsertLocal('entradas', mapEntradaFromDb(rp.data));
        }
      }
    } else {
      // 2b) novo agendamento
      var ri = await db.from('agendamentos').insert(agendamentoToDb(payload, studioId)).select().single();
      if(ri.error) throw ri.error;
      App.upsertLocal('agendamentos', mapAgendamentoFromDb(ri.data));
      agId = ri.data.id;

      var sinal = Number(document.getElementById('f_sinal').value)||0;
      if(sinal>0){
        var parceladoSinal = false, parcelasSinal = null;
        var formaSinalEl = document.getElementById('f_formaSinal');
        if(formaSinalEl && formaSinalEl.value==='Cartão de crédito'){
          parceladoSinal = document.getElementById('f_parceladoSinal').checked;
          if(parceladoSinal){
            parcelasSinal = Number(document.getElementById('f_parcelasSinal').value)||2;
            if(parcelasSinal<2) parcelasSinal = 2;
          }
        }
        var rs = await db.from('entradas').insert(entradaToDb({
          data: document.getElementById('f_dataSinal').value||todayISO(),
          clienteId: clienteId, clienteNome: clienteNome, agendamentoId: agId,
          descricao: 'Sinal — '+tatuagem, valor: sinal,
          formaPagamento: document.getElementById('f_formaSinal').value,
          parcelado: parceladoSinal, parcelas: parcelasSinal, observacao:''
        }, studioId)).select().single();
        if(rs.error) throw rs.error;
        App.upsertLocal('entradas', mapEntradaFromDb(rs.data));
      }
    }
    App.setSyncStatus('saved');
    closeModal(); App.renderView(App.state.currentView); App.toast('Agendamento salvo.');
  }catch(err){
    App.handleSaveError(err, 'salvar o agendamento');
  }
};
App.deleteAgendamento = function(id){
  confirmModal('Excluir este agendamento? As entradas já registradas para ele permanecerão, mas perderão o vínculo.', async function(){
    App.setSyncStatus('saving');
    try{
      var res = await App.db.client.from('agendamentos').delete().eq('id', id);
      if(res.error) throw res.error;
      App.state.agendamentos = App.state.agendamentos.filter(function(a){return a.id!==id;});
      App.state.entradas.forEach(function(e){ if(e.agendamentoId===id) e.agendamentoId=null; }); // FK on delete set null
      App.setSyncStatus('saved');
      closeModal(); App.renderView(App.state.currentView); App.toast('Agendamento excluído.');
    }catch(err){
      App.handleSaveError(err, 'excluir o agendamento');
    }
  });
};

/* ================================ MODAIS ====================================*/
function openModal(title, bodyHtml, large){
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay open" id="ov" onclick="if(event.target.id===\'ov\')closeModal()">'+
      '<div class="modal '+(large?'modal-lg':'')+'">'+
        '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="modal-close" onclick="closeModal()">✕</button></div>'+
        bodyHtml+
      '</div></div>';
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function confirmModal(msg, onYes){
  openModal('Confirmar ação', '<p style="font-size:13.5px;margin:0 0 6px 0">'+esc(msg)+'</p>'+
    '<div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-danger" style="background:var(--money-neg);border-color:var(--money-neg);color:#fff" id="confirmYesBtn">Confirmar exclusão</button></div>');
  document.getElementById('confirmYesBtn').onclick = function(){ closeModal(); onYes(); };
}
window.closeModal = closeModal;

App.openHelp = function(){
  var legacy = App.findLegacyData();
  var estados = {saved:'Sincronizado', saving:'Salvando…', error:'Erro de sincronização', offline:'Sem conexão'};
  var roles = {owner:'Proprietário', admin:'Administrador', tatuador:'Tatuador'};
  openModal('Conta & dados',
    '<div class="panel" style="margin:0 0 14px 0;padding:14px">'+
      '<div class="hint">Estúdio</div><div style="font-weight:700;margin-bottom:8px">'+esc(App.db.studioNome||'—')+'</div>'+
      '<div class="hint">Usuário</div><div style="font-weight:600;margin-bottom:8px">'+esc(App.db.userEmail||'—')+' · '+esc(roles[App.db.role]||App.db.role||'')+'</div>'+
      '<div class="hint">Estado da sincronização</div><div style="font-weight:600">'+esc(estados[App._sync]||'Sincronizado')+'</div>'+
    '</div>'+
    '<p style="font-size:12.5px;line-height:1.6;color:var(--text-muted)">Todos os dados ficam salvos na nuvem (Supabase) e aparecem automaticamente em todos os aparelhos em que você entrar com sua conta. Use "Exportar CSV" de vez em quando como backup extra.</p>'+
    (legacy?'<div class="panel" style="padding:14px;border:1px solid var(--gold);margin:12px 0"><b style="font-size:13px">Dados antigos encontrados neste navegador</b><p class="hint" style="margin:6px 0 10px">Existem registros salvos localmente por uma versão anterior do sistema. Você pode importá-los para a nuvem (uma única vez).</p><button class="btn btn-primary btn-sm" onclick="closeModal();App.importLegacy()">Importar dados antigos</button></div>':'')+
    '<div class="form-actions" style="justify-content:flex-start;flex-wrap:wrap">'+
      '<button class="btn" onclick="App.doLogout()">Sair da conta</button>'+
      (App.db.role==='owner'?'<button class="btn btn-danger" onclick="App.clearAllData()">Apagar todos os dados</button>':'')+
    '</div>'+
    '<div class="form-actions"><button class="btn btn-primary" onclick="closeModal()">Fechar</button></div>'
  , true);
};
App.clearAllData = function(){
  confirmModal('Isso vai apagar TODOS os clientes, agendamentos, entradas e saídas do estúdio, em todos os aparelhos. Não dá para desfazer. Deseja continuar?', async function(){
    App.setSyncStatus('saving');
    try{
      var sid = App.db.studioId, c = App.db.client;
      var order = ['entradas','agendamentos','saidas','clientes'];
      for(var i=0;i<order.length;i++){
        var res = await c.from(order[i]).delete().eq('studio_id', sid);
        if(res.error) throw res.error;
        App.state[order[i]] = [];
      }
      App.setSyncStatus('saved'); closeModal();
      App.renderView(App.state.currentView); App.toast('Todos os dados foram apagados.');
    }catch(err){ App.handleSaveError(err, 'apagar os dados'); }
  });
};

/* =============================== EXPORTAÇÃO =================================*/
App.exportCSV = function(kind){
  var rows=[], headers=[], filename='';
  if(kind==='entradas'){
    headers=['Data','Cliente','Descrição','Valor','Forma de pagamento','Parcelas','Observação'];
    rows = App.state.entradas.slice().sort(function(a,b){return a.data<b.data?-1:1;}).map(function(e){
      return [dateBR(e.data), e.clienteNome||'', e.descricao, String(e.valor).replace('.',','), e.formaPagamento, (e.parcelado&&e.parcelas)?(e.parcelas+'x'):'', e.observacao||''];
    });
    filename='entradas.csv';
  } else if(kind==='saidas'){
    headers=['Data','Categoria','Descrição','Valor','Forma de pagamento','Observação'];
    rows = App.state.saidas.slice().sort(function(a,b){return a.data<b.data?-1:1;}).map(function(s){
      return [dateBR(s.data), s.categoria, s.descricao, String(s.valor).replace('.',','), s.formaPagamento, s.observacao||''];
    });
    filename='saidas.csv';
  } else if(kind==='fluxo'){
    var range = App.financeiroRange();
    headers=['Data','Descrição','Entrada','Saída'];
    var mov = App.entradasNoPeriodo(range[0],range[1]).map(function(e){return [dateBR(e.data), e.descricao, String(e.valor).replace('.',','), ''];})
      .concat(App.saidasNoPeriodo(range[0],range[1]).map(function(s){return [dateBR(s.data), s.descricao, '', String(s.valor).replace('.',',')];}));
    rows = mov.sort(function(a,b){return a[0]<b[0]?-1:1;});
    filename='fluxo_de_caixa.csv';
  } else if(kind==='fechamento'){
    var mk = App.state.fechamentoMonth;
    headers=['Mês','Total recebido','Total gasto','Saldo','Tatuagens concluídas','Cancelamentos'];
    var de=mk+'-01', ate=mk+'-'+pad2(daysInMonth(mk));
    var tr=App.sum(App.entradasNoPeriodo(de,ate)), tg=App.sum(App.saidasNoPeriodo(de,ate));
    var ags = App.state.agendamentos.filter(function(a){return monthKey(a.data)===mk;});
    rows=[[monthLabel(mk), String(tr).replace('.',','), String(tg).replace('.',','), String(tr-tg).replace('.',','),
      String(ags.filter(function(a){return a.status==='Concluído';}).length),
      String(ags.filter(function(a){return a.status==='Cancelado';}).length)]];
    filename='fechamento_'+mk+'.csv';
  } else if(kind==='agenda'){
    headers=['Data','Horário','Cliente','Tatuagem','Local','Valor','Status'];
    rows = App.state.agendamentos.slice().sort(function(a,b){return a.data<b.data?-1:1;}).map(function(a){
      return [dateBR(a.data), a.horaInicio, a.clienteNome, a.tatuagem, a.localCorpo, String(a.valor).replace('.',','), a.status];
    });
    filename='agenda.csv';
  }
  var csv = headers.join(';')+'\n'+rows.map(function(r){
    return r.map(function(c){ c=String(c==null?'':c); return '"'+c.replace(/"/g,'""')+'"'; }).join(';');
  }).join('\n');

  App._trySaveFile(filename, csv);
};

App._trySaveFile = function(filename, content){
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(downloads){
      if(!downloads){ App._fallbackDownload(filename, content); return; }
      downloads.save({filename:filename, data:content}).then(function(){
        App.toast('Arquivo "'+filename+'" pronto para salvar.');
      }).catch(function(){ App._fallbackDownload(filename, content); });
    }).catch(function(){ App._fallbackDownload(filename, content); });
  } else {
    App._fallbackDownload(filename, content);
  }
};
App._fallbackDownload = function(filename, content){
  try{
    var blob = new Blob(['\ufeff'+content], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);}, 3000);
  }catch(e){ App.toast('Não foi possível exportar o arquivo neste ambiente.'); }
};

/* ================================= INIT ======================================*/
function init(){
  App.load();
  App.applyTheme();
  if(!App.db.isConfigured()){ App.renderSetupNeeded(); return; }
  if(typeof supabase==='undefined'){
    authScreen('<h3>Sem conexão com o servidor</h3><p class="hint" style="font-size:12.5px;line-height:1.6">Não foi possível carregar a biblioteca do Supabase. Verifique sua internet e recarregue a página.</p>');
    return;
  }
  App.db.init();
  App.db.client.auth.onAuthStateChange(function(event){
    if(event==='PASSWORD_RECOVERY'){ App.renderNewPassword(); }
    else if(event==='SIGNED_OUT' && App.db.studioId){ App.doLogout(); } // saiu em outra aba/aparelho
  });
  App.bootstrapSession();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
